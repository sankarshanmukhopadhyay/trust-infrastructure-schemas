name: Validate TIS Candidate
on:
  pull_request:
  push: {branches: [main]}
permissions: {contents: read}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Confirm dependency-free validator
        run: node -e "const p=require('./package.json'); if (Object.keys(p.devDependencies || {}).length) process.exit(1); console.log('No npm install required')"
      - run: npm run candidate:check
      - uses: actions/upload-artifact@v4
        with:
          name: tis-candidate-evidence
          path: artifacts/
